<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASTIFY</title>
<style>
:root{--bg:#000;--panel:#121212;--card:#181818;--hover:#282828;--text:#fff;--sub:#b3b3b3;--green:#1ed760}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Circular Std","Helvetica Neue",Arial,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--text);display:grid;grid-template-columns:300px 1fr;grid-template-rows:1fr 90px;gap:8px;padding:8px;overflow:hidden}
button{border:0;background:none;color:inherit;cursor:pointer}
svg{width:1em;height:1em;fill:currentColor;flex:none}
.side{grid-row:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.box{background:var(--panel);border-radius:8px}
.nav{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#000;font-size:18px;font-style:normal}
.nav button{display:flex;align-items:center;gap:16px;font-size:16px;font-weight:700;color:var(--sub);text-align:left;transition:color .15s}
.nav button svg{font-size:24px}
.nav button:hover,.nav button.on{color:var(--text)}
.lib{flex:1;padding:16px 8px;overflow:auto;min-height:0}
.lib h2{font-size:16px;color:var(--sub);padding:0 12px 12px;display:flex;align-items:center;gap:10px}
.lib h2 svg{font-size:24px}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--hover)}
.row img,.row .ph{width:48px;height:48px;border-radius:4px;object-fit:cover;background:#333;flex:none}
.row .ph{display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#450af5,#c4efd9)}
.row div{min-width:0}
.row b,.row small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b{font-size:15px;font-weight:500}
.row small{font-size:13px;color:var(--sub);margin-top:3px}
.row.cur b{color:var(--green)}
.main{grid-row:1;grid-column:2;overflow:auto;position:relative;background:linear-gradient(#2a2a2a 0,var(--panel) 280px);border-radius:8px;min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:16px 24px;background:rgba(18,18,18,.85);backdrop-filter:blur(8px)}
.top .circ{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;font-size:18px}
form{flex:1;max-width:420px;position:relative}
form svg{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--sub);font-size:22px;pointer-events:none}
input{width:100%;height:48px;border-radius:500px;border:2px solid transparent;background:#242424;color:var(--text);font-size:15px;padding:0 16px 0 46px;outline:none}
input:hover{background:#2a2a2a}
input:focus{border-color:var(--text)}
.content{padding:8px 24px 32px}
.content h2{font-size:24px;font-weight:700;margin:16px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#2a2a2a;padding:8px 16px;border-radius:500px;font-size:14px;transition:background .15s}
.chip:hover{background:#3a3a3a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.card{background:var(--card);padding:16px;border-radius:8px;cursor:pointer;position:relative;transition:background .2s;min-width:0}
.card:hover,.card.cur{background:var(--hover)}
.card .cv{position:relative;margin-bottom:16px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#333;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card .pl{position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center;font-size:22px;opacity:0;translate:0 8px;transition:.2s;box-shadow:0 8px 8px rgba(0,0,0,.3)}
.card:hover .pl,.card.cur .pl{opacity:1;translate:0 0}
.card h3{font-size:16px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.cur h3{color:var(--green)}
.card p{font-size:14px;color:var(--sub);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{text-align:center;color:var(--sub);padding:60px 12px;font-size:16px;overflow-wrap:anywhere}
.msg b{display:block;color:var(--text);font-size:22px;margin-bottom:8px}
.bar{grid-row:2;grid-column:1/-1;display:grid;grid-template-columns:1fr minmax(280px,722px) 1fr;align-items:center;gap:16px;padding:0 12px}
.now{display:flex;align-items:center;gap:14px;min-width:0}
.now img{width:56px;height:56px;border-radius:4px;object-fit:cover;background:#333;flex:none}
.now div{min-width:0}
.now b,.now small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now b{font-size:14px;font-weight:500}
.now small{font-size:12px;color:var(--sub);margin-top:4px}
.like{font-size:20px;color:var(--sub)}
.like:hover{color:var(--text)}
.like.on{color:var(--green)}
.ctr{display:flex;flex-direction:column;align-items:center;gap:8px}
.btns{display:flex;align-items:center;gap:20px}
.btns button{font-size:22px;color:var(--sub)}
.btns button:hover{color:var(--text)}
.btns .pp{width:34px;height:34px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center;font-size:18px}
.btns .pp:hover{transform:scale(1.06);color:#000}
.prog{display:flex;align-items:center;gap:8px;width:100%;font-size:12px;color:var(--sub)}
.prog span{width:40px}
.prog span:first-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--text) var(--p,0%),#4d4d4d var(--p,0%));padding:0;border:0;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;opacity:0}
input[type=range]:hover{background:linear-gradient(to right,var(--green) var(--p,0%),#4d4d4d var(--p,0%))}
input[type=range]:hover::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.prog input{flex:1}
.vol{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:20px;color:var(--sub)}
.vol input{width:100px}
#yt{position:fixed;width:200px;height:200px;left:-9999px;top:0;opacity:0;pointer-events:none}
button:focus-visible,.card:focus-visible,.row:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.mnav{display:none}
@media(max-width:820px){
body{grid-template-columns:1fr;grid-template-rows:1fr 70px 56px;gap:0;padding:0}
.side{display:none}
.main{grid-column:1;border-radius:0}
.top{padding:12px 16px}
.content{padding:8px 16px 24px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.bar{grid-row:2;grid-template-columns:1fr auto;background:#1a1a1a;margin:0 8px;border-radius:8px;height:62px;align-self:center;padding:0 10px}
.ctr{gap:0}
.btns .sk,.prog span,.vol{display:none}
.btns{gap:14px}
.prog{position:absolute;left:0;right:0;bottom:0}
.bar{position:relative}
.prog input{width:100%;height:2px}
.now img{width:44px;height:44px}
.mnav{display:flex;justify-content:space-around;align-items:center;background:#000}
.mnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub)}
.mnav button svg{font-size:24px}
.mnav button.on{color:var(--text)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg style="display:none">
<symbol id="i-home" viewBox="0 0 24 24"><path d="M12.5 3.2a1 1 0 0 0-1 0L3 8.1V21h7v-6h4v6h7V8.1z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.6 13.4l4.8 4.8 1.4-1.4-4.8-4.8A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></symbol>
<symbol id="i-lib" viewBox="0 0 24 24"><path d="M3 22V2h2v20zm5 0V2h2v20zm5.5-19.9 1.9-.5 5 19.4-1.9.5z"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a.5.5 0 0 0 .76.43l12.3-7.5a.5.5 0 0 0 0-.86L7.76 4.07A.5.5 0 0 0 7 4.5"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5.5v13l9-6.5zM17 5h2v14h-2z"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5.5v13L9 12zM5 5h2v14H5z"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21 10.6 19.8C5.4 15.1 2 12 2 8.3 2 5.3 4.3 3 7.2 3c1.7 0 3.4.8 4.8 2.1C13.4 3.8 15.1 3 16.8 3 19.7 3 22 5.3 22 8.3c0 3.700-3.400 6.800-8.600 11.500z"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13.500 3a4.500 4.500 0 0 0-2.500-4v8a4.500 4.500 0 0 0 2.500-4m-2.500-8.800v2.100a7 7 0 0 1 0 13.400v2.100a9 9 0 0 0 0-17.600"/></symbol>

</svg>

<aside class="side">
  <nav class="box nav">
    <div class="logo"><i>L</i>Lastify</div>
    <button data-view="home" class="on"><svg><use href="#i-home"/></svg>Ana Sayfa</button>
    <button data-view="search"><svg><use href="#i-search"/></svg>Ara</button>
  </nav>
  <section class="box lib">
    <h2><svg><use href="#i-lib"/></svg>Kitaplığın</h2>
    <div class="row" id="likedRow" tabindex="0" role="button">
      <div class="ph"><svg><use href="#i-heart"/></svg></div>
      <div><b>Beğenilen Şarkılar</b><small id="likedCount">0 şarkı</small></div>
    </div>
    <div id="recent"></div>
  </section>
</aside>

<main class="main" id="scroller">
  <div class="top">
    <div class="circ"><svg><use href="#i-back"/></svg></div>
    <form id="form">
      <svg><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Ne dinlemek istiyorsun?" autocomplete="off">
    </form>
  </div>
  <div class="content" id="content"></div>
</main>

<footer class="bar">
  <div class="now">
    <img id="cover" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="">
    <div><b id="ttl">Şarkı seçilmedi</b><small id="art">Bir şarkı seç ve çalmaya başla</small></div>
    <button class="like" id="likeBtn" aria-label="Beğen"><svg><use href="#i-heart"/></svg></button>
  </div>
  <div class="ctr">
    <div class="btns">
      <button class="sk" id="prev" aria-label="Önceki"><svg><use href="#i-prev"/></svg></button>
      <button class="pp" id="pp" aria-label="Çal / Duraklat"><svg><use href="#i-play"/></svg></button>
      <button class="sk" id="next" aria-label="Sonraki"><svg><use href="#i-next"/></svg></button>
    </div>
    <div class="prog">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="İlerleme">
      <span id="dur">0:00</span>
    </div>
  </div>
  <div class="vol">
    <svg><use href="#i-vol"/></svg>
    <input type="range" id="vol" min="0" max="100" value="80" aria-label="Ses">
  </div>
</footer>

<nav class="mnav">
  <button data-view="home" class="on"><svg><use href="#i-home"/></svg>Ana Sayfa</button>
  <button data-view="search"><svg><use href="#i-search"/></svg>Ara</button>
  <button data-view="liked"><svg><use href="#i-heart"/></svg>Beğenilenler</button>
</nav>
<div id="yt"><div id="ytp"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = id => document.getElementById(id);
const content = $("content"), qInput = $("q");
const FALLBACK = ["https://inv.nadeko.net","https://invidious.nerdvpn.de","https://invidious.tiekoetter.com"];
const GENRES = ["Pop","Rock","Rap","Türkçe Pop","Arabesk","Lo-fi","Jazz","Klasik","Elektronik","Akustik"];

let queue = [], idx = -1, player = null, ready = false, timer = null, view = "home", lastQuery = "";
let liked = load("lastify_liked", []), recent = load("lastify_recent", []);

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) || d } catch { return d } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
const thumb = id => "https://i.ytimg.com/vi/" + encodeURIComponent(id) + "/mqdefault.jpg";
const fmt = s => { s = Math.max(0, s|0); return (s/60|0) + ":" + String(s%60).padStart(2,"0") };
const icon = n => { const s = document.createElementNS("http://www.w3.org/2000/svg","svg"); const u = document.createElementNS("http://www.w3.org/2000/svg","use"); u.setAttribute("href","#i-"+n); s.appendChild(u); return s };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };

/* ---------- Arama ---------- */
async function fetchTracks(q){
  const clean = d => d.filter(x => x.type === "video" && typeof x.videoId === "string" && typeof x.title === "string")
    .slice(0, 40).map(x => ({ videoId: x.videoId, title: x.title, author: x.author || "Bilinmeyen sanatçı" }));
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q), { signal: AbortSignal.timeout(12000) });
    if (r.ok) { const d = await r.json(); if (Array.isArray(d)) return d.map(x => ({ videoId: x.videoId, title: x.title, author: x.author || "Bilinmeyen sanatçı" })); }
  } catch {}
  for (const base of FALLBACK) {
    try {
      const u = new URL("/api/v1/search", base);
      u.searchParams.set("q", q); u.searchParams.set("type", "video");
      const r = await fetch(u, { signal: AbortSignal.timeout(9000), headers: { Accept: "application/json" } });
      if (!r.ok) continue;
      const d = await r.json();
      if (Array.isArray(d)) return clean(d);
    } catch {}
  }
  return null;
}

async function doSearch(q){
  q = q.trim(); if (!q) return;
  lastQuery = q; setView("search", true);
  content.replaceChildren(msg("Aranıyor...", q));
  const tracks = await fetchTracks(q);
  if (q !== lastQuery) return;
  if (tracks === null) return content.replaceChildren(msg("Arama sunucularına bağlanılamadı", "Biraz sonra tekrar dene."));
  if (!tracks.length) return content.replaceChildren(msg("Sonuç bulunamadı", "“" + q + "” için sonuç yok. Yazımı kontrol et ya da başka bir şey ara."));
  renderGrid("“" + q + "” için sonuçlar", tracks);
}

function msg(title, sub){ const d = el("div","msg"); d.append(el("b",null,title), document.createTextNode(sub || "")); return d }

/* ---------- Görünümler ---------- */
function setView(v, keep){
  view = v;
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === (v === "liked" ? "" : v)));
  if (keep) return;
  if (v === "home") renderHome();
  if (v === "search"){ content.replaceChildren(msg("Ara", "Şarkı, sanatçı ya da bir tür yaz.")); qInput.focus() }
  if (v === "liked") liked.length ? renderGrid("Beğenilen Şarkılar", liked) : content.replaceChildren(msg("Henüz beğendiğin şarkı yok", "Çalan şarkının yanındaki kalbe dokun, burada görünsün."));
}

function renderHome(){
  const wrap = el("div");
  wrap.append(el("h2", null, "Türlere göz at"));
  const chips = el("div","chips");
  GENRES.forEach(g => { const b = el("button","chip",g); b.onclick = () => { qInput.value = g; doSearch(g) }; chips.appendChild(b) });
  wrap.appendChild(chips);
  if (recent.length){ wrap.appendChild(el("h2", null, "Son çaldıkların")); wrap.appendChild(buildGrid(recent)) }
  else wrap.appendChild(msg("Müzik seni bekliyor", "Yukarıdan ara ya da bir türe dokun."));
  content.replaceChildren(wrap);
}

function buildGrid(tracks){
  const g = el("div","grid");
  tracks.forEach((t, i) => {
    const c = el("article","card"); c.tabIndex = 0; c.dataset.id = t.videoId;
    const cv = el("div","cv"); const img = el("img"); img.loading = "lazy"; img.alt = ""; img.src = thumb(t.videoId);
    const pl = el("div","pl"); pl.appendChild(icon("play")); cv.append(img, pl);
    c.append(cv, el("h3",null,t.title), el("p",null,t.author));
    const go = () => playList(tracks, i);
    c.onclick = go; c.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go() } };
    g.appendChild(c);
  });
  return g;
}
function renderGrid(title, tracks){
  const w = el("div"); w.append(el("h2", null, title), buildGrid(tracks)); content.replaceChildren(w); markCurrent();
}
function markCurrent(){
  const id = queue[idx]?.videoId;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("cur", c.dataset.id === id));
  document.querySelectorAll("#recent .row").forEach(r => r.classList.toggle("cur", r.dataset.id === id));
}

/* ---------- Kitaplık ---------- */
function renderLib(){
  $("likedCount").textContent = liked.length + " şarkı";
  const box = $("recent"); box.replaceChildren();
  recent.slice(0, 20).forEach((t, i) => {
    const r = el("div","row"); r.tabIndex = 0; r.dataset.id = t.videoId;
    const img = el("img"); img.src = thumb(t.videoId); img.alt = ""; img.loading = "lazy";
    const d = el("div"); d.append(el("b",null,t.title), el("small",null,t.author));
    r.append(img, d); r.onclick = () => playList(recent, i);
    r.onkeydown = e => { if (e.key === "Enter") playList(recent, i) };
    box.appendChild(r);
  });
  markCurrent();
}

/* ---------- Oynatıcı ---------- */
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("ytp", {
    height: "200", width: "200",
    playerVars: { playsinline: 1, controls: 0, rel: 0 },
    events: {
      onReady: () => { ready = true; player.setVolume($("vol").value); if (idx >= 0) player.loadVideoById(queue[idx].videoId) },
      onStateChange: e => {
        const playing = e.data === YT.PlayerState.PLAYING;
        $("pp").firstChild.replaceWith(icon(playing ? "pause" : "play"));
        if (e.data === YT.PlayerState.ENDED) step(1);
      },
      onError: () => step(1)
    }
  });
};

function playList(list, i){
  queue = list.slice(); idx = i; loadCurrent();
}
function loadCurrent(){
  const t = queue[idx]; if (!t) return;
  $("ttl").textContent = t.title; $("art").textContent = t.author;
  $("cover").src = thumb(t.videoId); document.title = t.title + " • LASTIFY";
  recent = [t, ...recent.filter(x => x.videoId !== t.videoId)].slice(0, 30); save("lastify_recent", recent); renderLib();
  syncLike(); markCurrent();
  if (ready) player.loadVideoById(t.videoId);
  clearInterval(timer); timer = setInterval(tick, 500);
}
function step(d){
  if (!queue.length) return;
  idx = (idx + d + queue.length) % queue.length; loadCurrent();
}
function tick(){
  if (!ready || !player.getDuration) return;
  const dur = player.getDuration() || 0, cur = player.getCurrentTime() || 0;
  $("cur").textContent = fmt(cur); $("dur").textContent = fmt(dur);
  if (!seeking){ const p = dur ? cur / dur * 1000 : 0; $("seek").value = p; $("seek").style.setProperty("--p", p/10 + "%") }
}
let seeking = false;
$("seek").addEventListener("input", e => { seeking = true; e.target.style.setProperty("--p", e.target.value/10 + "%") });
$("seek").addEventListener("change", e => { if (ready) player.seekTo(player.getDuration() * e.target.value / 1000, true); seeking = false });
$("vol").addEventListener("input", e => { e.target.style.setProperty("--p", e.target.value + "%"); if (ready) player.setVolume(e.target.value) });
$("vol").style.setProperty("--p", "80%");
$("pp").onclick = () => {
  if (!ready || idx < 0) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
};
$("next").onclick = () => step(1);
$("prev").onclick = () => { if (ready && player.getCurrentTime() > 3) player.seekTo(0, true); else step(-1) };

/* ---------- Beğeni ---------- */
function syncLike(){
  const t = queue[idx];
  $("likeBtn").classList.toggle("on", !!t && liked.some(x => x.videoId === t.videoId));
  $("likedCount").textContent = liked.length + " şarkı";
}
$("likeBtn").onclick = () => {
  const t = queue[idx]; if (!t) return;
  liked = liked.some(x => x.videoId === t.videoId) ? liked.filter(x => x.videoId !== t.videoId) : [t, ...liked];
  save("lastify_liked", liked); syncLike();
  if (view === "liked") setView("liked");
};

/* ---------- Olaylar ---------- */
$("form").addEventListener("submit", e => { e.preventDefault(); doSearch(qInput.value) });
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
$("likedRow").onclick = () => setView("liked");
$("likedRow").onkeydown = e => { if (e.key === "Enter") setView("liked") };
document.addEventListener("keydown", e => {
